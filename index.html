    <!-- JSON-LD Schema - FAQPage (for AI search citation) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Connex Technologies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Connex Technologies is a neutral payment coordination layer for Kenya and Africa. We sit alongside existing payment systems to automatically enrich outgoing payment messages to ISO 20022 standards and generate tamper-evident cryptographic proof of every cross-institutional payment handoff. We do not move money, process payments, or sit in the payment path."
          }
        },
        {
          "@type": "Question",
          "name": "What problem does Connex solve in the Kenyan payment system?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When money moves between banks and financial institutions in Kenya, two things consistently fail: critical data fields are lost as payment messages cross system boundaries (the data gap), and there is no neutral record of the handoff (the evidence gap). When institutions' logs disagree, disputes take weeks to resolve with no independent witness. Connex fixes both problems with a single coordination layer."
          }
        },
        {
          "@type": "Question",
          "name": "How does Connex connect to existing payment infrastructure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Institutions connect to Connex via a lightweight REST API. The connection is non-invasive - Connex observes payment handoff events without sitting in the transaction path. If Connex goes offline, every payment continues without interruption. We never become a dependency for payment operations."
          }
        },
        {
          "@type": "Question",
          "name": "What is ISO 20022 and why does it matter for Kenyan banks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ISO 20022 is the global standard for financial messaging, adopted by central banks and major payment networks worldwide. It carries significantly more structured compliance data than older formats like ISO 8583 that most Kenyan banks still use. When payment messages cross institutional boundaries, critical ISO 20022 fields are lost. Connex automatically enriches legacy messages to ISO 20022 standards so compliance data arrives intact."
          }
        },
        {
          "@type": "Question",
          "name": "Does Connex store customer financial data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Connex operates on a zero-knowledge principle. We do not store transaction data, account numbers, customer names, or personal financial data. We capture only the structural metadata of payment handoffs needed to generate a verifiable cryptographic proof - nothing more."
          }
        },
        {
          "@type": "Question",
          "name": "Who founded Connex Technologies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Connex Technologies was founded by Roy Chumba, based in Kenya. Roy is a three-time winner of the Kenya Science and Engineering Fair in Computer Science and the architect of the Connex payment coordination layer."
          }
        }
      ]
    }
    </script>
